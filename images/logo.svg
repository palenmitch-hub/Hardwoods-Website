  <!-- Wordmark -->
  <text x="64" y="30" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="-0.5">MITCH'S</text>
  <text x="64" y="50" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-weight="300" font-size="16" fill="#c9a96e" letter-spacing="3">HARDWOODS</text>
